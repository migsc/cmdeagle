# DRAFT: the cmdeagle v2 spec shape is not final.
# Phase 1 wraps the existing Python script through `exec` (the any-language claim).
# Phase 2 moves commands into TypeScript cores one at a time.
schemaVersion: 2
name: t3ctl
description: Control local T3 Code projects and threads.

requires:
  executables: [t3, python3]

commands:
  status:
    description: Projects and threads, read-only.
    effects: { reads: [t3 data] }
    exec: [python3, ./legacy/t3ctl, status]
  open:
    description: Register a folder as a project.
    args: [{ name: folder, type: path, mustExist: true }]
    effects: { writes: [t3 data] }
    exec: [python3, ./legacy/t3ctl, open, "{folder}"]
  rename:
    description: Change a project's display title.
    args: [{ name: project, type: string }, { name: title, type: string }]
    effects: { writes: [t3 data] }
    exec: [python3, ./legacy/t3ctl, rename, "{project}", "{title}"]
  thread:
    description: Prepare a thread plan file. Nothing starts.
    args: [{ name: project, type: string }, { name: title, type: string }]
    flags:
      provider: { type: string, required: true }
      model:    { type: string, required: true }
      prompt:   { type: string, required: true }
      out:      { type: path, required: true, mustNotExist: true }
    effects: { writes: [out] }
    exec: [python3, ./legacy/t3ctl, thread, "{project}", "{title}", --provider, "{provider}", --model, "{model}", --prompt, "{prompt}", --out, "{out}"]
  apply:
    description: Create a prepared thread on the local T3 server.
    args: [{ name: plan, type: path, mustExist: true }]
    effects: { network: { targets: [127.0.0.1] }, writes: [t3 data] }
    exec: [python3, ./legacy/t3ctl, apply, "{plan}", --local-auth]
  send:
    description: Start a model turn on a thread. Uses provider quota or money.
    args: [{ name: thread, type: string }, { name: prompt, type: string }]
    effects:
      network: { targets: [127.0.0.1] }
      cost: { confirm: --personal-account-confirmed }
    exec: [python3, ./legacy/t3ctl, send, "{thread}", "{prompt}", --local-auth, --personal-account-confirmed]
