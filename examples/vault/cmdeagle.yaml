# DRAFT: the cmdeagle v2 spec shape is not final. Core files arrive with implementation.
schemaVersion: 2
name: vault
description: Find and write notes in an Obsidian vault.

config:
  root: { type: path, env: VAULT_ROOT, required: true }

commands:
  search:
    description: Find notes by title, text, or tag.
    args: [{ name: query, type: string }]
    flags: { limit: { type: integer, default: 20 } }
    effects: { reads: [root] }
    core: ./core/index.ts#search
  new:
    description: Create a note, optionally linked from today's daily note.
    args: [{ name: title, type: string }]
    flags:
      folder:     { type: string, default: Inbox }
      body:       { type: string, describe: Note text; reads stdin when "-" }
      link-daily: { type: boolean }
    effects: { writes: [root] }
    dryRun: required
    core: ./core/index.ts#create
  link-daily:
    description: Link an existing note from today's daily note.
    args: [{ name: note, type: string }]
    effects: { writes: [root] }
    dryRun: required
    core: ./core/index.ts#linkDaily
